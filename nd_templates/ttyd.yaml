---
name: ttyd
url: https://github.com/tsl0922/ttyd
binaries:
  urls:
    1.7.7: https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd
  arguments:
    required:
      - version
    optional:
      arch: "x86_64"
      addpath: ""
  dependencies:
    apt:
      - tmux
    yum:
      - tmux
  # EPEL 7's ttyd predates the -W option used by the OOD launcher.
  instructions: |
    export TZ={{ self.env.TZ }}
    {% if self.pkg_manager == "apt" %}
    export DEBIAN_FRONTEND=noninteractive
    {% endif %}
    {{ self.install_dependencies() }}
    {% if self.pkg_manager == "yum" %}
    . /etc/os-release
    if [ "${VERSION_ID%%.*}" = "7" ]; then curl -fL --output /usr/bin/ttyd "{{ self.urls[self.version] }}.{{ self.arch }}"; else yum install -y ttyd-{{ self.version }}; fi
    {% else %}
    curl -fL --output /usr/bin/ttyd "{{ self.urls[self.version] }}.{{ self.arch }}"
    {% endif %}
    {% if self.addpath %}
    echo "#!/usr/bin/env bash" > /etc/profile.d/tmux.sh 
    echo "export PATH=\$PATH:{{ self.addpath }}" >> /etc/profile.d/tmux.sh
    chmod +x /etc/profile.d/tmux.sh
    {% endif %}
    chmod +x /usr/bin/ttyd
  env:
    TZ: "America/New_York"